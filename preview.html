<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>AMIT • Automatic ZIP Downloader</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN for instant preview -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#b9ddfe',
              300: '#7cc1fd',
              400: '#36a2fa',
              500: '#0c87eb',
              600: '#026bc9',
              700: '#0355a3',
              800: '#074886',
              900: '#0c3d6f',
            }
          },
          animation: {
            'subtle-pulse': 'subtlePulse 2.5s ease-in-out infinite',
            'bounce-soft': 'bounceSoft 2s ease-in-out infinite',
            'fade-in': 'fadeIn 0.4s ease-out forwards'
          },
          keyframes: {
            subtlePulse: {
              '0%, 100%': { transform: 'scale(1)', opacity: '1' },
              '50%': { transform: 'scale(1.03)', opacity: '0.9' }
            },
            bounceSoft: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' }
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 CDN for standalone preview -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      margin: 0;
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(224, 239, 254, 0.6) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(240, 247, 255, 0.8) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(219, 234, 254, 0.4) 0px, transparent 50%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    .bg-mesh-dots {
      background-image: radial-gradient(rgba(148, 163, 184, 0.18) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-mesh-dots text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const DOWNLOAD_CONFIG = {
      siteName: "AMIT Downloader",
      siteDomain: "amit.vercel.app",
      targetProductionUrl: "https://amit.vercel.app",
      fileName: "AMIT.zip",
      filePath: "/downloads/AMIT.zip",
      fileMimeType: "application/zip",
      fileFormatLabel: "ZIP Compressed Archive",
      autoDownloadDelayMs: 1500,
      progressUpdateIntervalMs: 50,
      sessionStorageKey: "amit_zip_auto_downloaded_preview_v1",
      fallbackFileSize: "11.63 MB",
      copyrightYear: 2026,
      copyrightHolder: "AMIT"
    };

    function formatBytes(bytes, decimals = 2) {
      if (!bytes || isNaN(bytes) || bytes <= 0) return '0 B';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

    async function copyText(text) {
      if (navigator?.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {}
      }
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        document.body.appendChild(textArea);
        textArea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textArea);
        return ok;
      } catch {
        return false;
      }
    }

    function ZipIllustration() {
      return (
        <div className="relative flex items-center justify-center w-24 h-24 sm:w-28 sm:h-28 mx-auto">
          <div className="absolute inset-0 bg-brand-400/20 rounded-3xl blur-xl transform scale-90 pointer-events-none animate-subtle-pulse" />
          <svg viewBox="0 0 120 120" fill="none" className="w-full h-full drop-shadow-md">
            <rect x="22" y="16" width="76" height="92" rx="14" fill="#0c3d6f" fillOpacity="0.08" />
            <rect x="20" y="14" width="80" height="92" rx="14" fill="#ffffff" stroke="#bfdbfe" strokeWidth="1.5" />
            <path d="M72 14v16a4 4 0 0 0 4 4h24" fill="#e0effe" />
            <path d="M72 14l28 28h-24a4 4 0 0 1-4-4V14z" stroke="#93c5fd" strokeWidth="1.5" />
            <line x1="38" y1="28" x2="38" y2="76" stroke="#94a3b8" strokeWidth="2.5" strokeDasharray="3 3" />
            <line x1="42" y1="30" x2="42" y2="78" stroke="#cbd5e1" strokeWidth="2.5" strokeDasharray="3 3" />
            <rect x="34" y="52" width="12" height="18" rx="3" fill="#026bc9" />
            <rect x="37" y="56" width="6" height="10" rx="1.5" fill="#f0f7ff" />
            <rect x="42" y="80" width="46" height="20" rx="6" fill="#0c87eb" />
            <text x="65" y="94" fill="#ffffff" fontSize="11" fontWeight="800" textAnchor="middle" letterSpacing="0.08em" fontFamily="sans-serif">
              ZIP
            </text>
          </svg>
        </div>
      );
    }

    function App() {
      const [state, setState] = React.useState('checking');
      const [countdown, setCountdown] = React.useState(Math.ceil(DOWNLOAD_CONFIG.autoDownloadDelayMs / 1000));
      const [progress, setProgress] = React.useState(0);
      const [fileSize, setFileSize] = React.useState(DOWNLOAD_CONFIG.fallbackFileSize);
      const [copied, setCopied] = React.useState(false);
      const [copiedLink, setCopiedLink] = React.useState(false);
      const [showHelp, setShowHelp] = React.useState(false);

      const hasTriggeredRef = React.useRef(false);
      const timerRef = React.useRef(null);

      const executeDownload = (url, fileName) => {
        try {
          const link = document.createElement('a');
          link.href = url;
          link.setAttribute('download', fileName);
          link.setAttribute('rel', 'noopener noreferrer');
          link.style.display = 'none';
          document.body.appendChild(link);
          link.click();
          setTimeout(() => {
            if (link.parentNode) link.parentNode.removeChild(link);
          }, 400);
          return true;
        } catch (err) {
          console.error(err);
          return false;
        }
      };

      const checkFileStatus = async () => {
        try {
          const res = await fetch(DOWNLOAD_CONFIG.filePath, { method: 'HEAD' });
          if (!res.ok) {
            setState('error');
            return false;
          }
          const cl = res.headers.get('content-length');
          if (cl && !isNaN(cl)) {
            setFileSize(formatBytes(parseInt(cl, 10)));
          }
          return true;
        } catch {
          return true;
        }
      };

      const handleManualDownload = () => {
        executeDownload(DOWNLOAD_CONFIG.filePath, DOWNLOAD_CONFIG.fileName);
        setState('triggered');
        try { sessionStorage.setItem(DOWNLOAD_CONFIG.sessionStorageKey, 'true'); } catch {}
      };

      const handleResetTrigger = () => {
        try { sessionStorage.removeItem(DOWNLOAD_CONFIG.sessionStorageKey); } catch {}
        hasTriggeredRef.current = false;
        if (timerRef.current) clearInterval(timerRef.current);
        setProgress(0);
        setCountdown(Math.ceil(DOWNLOAD_CONFIG.autoDownloadDelayMs / 1000));
        startSequence();
      };

      const startSequence = async () => {
        setState('checking');
        const ok = await checkFileStatus();
        if (!ok) return;

        let already = false;
        try { already = sessionStorage.getItem(DOWNLOAD_CONFIG.sessionStorageKey) === 'true'; } catch {}
        if (already) {
          setState('triggered');
          setProgress(100);
          return;
        }

        setState('counting');
        const total = DOWNLOAD_CONFIG.autoDownloadDelayMs;
        const interval = DOWNLOAD_CONFIG.progressUpdateIntervalMs;
        let elapsed = 0;

        timerRef.current = setInterval(() => {
          elapsed += interval;
          const pct = Math.min(100, (elapsed / total) * 100);
          setProgress(pct);
          setCountdown(Math.max(0, Math.ceil((total - elapsed) / 1000)));

          if (elapsed >= total) {
            clearInterval(timerRef.current);
            if (!hasTriggeredRef.current) {
              hasTriggeredRef.current = true;
              const success = executeDownload(DOWNLOAD_CONFIG.filePath, DOWNLOAD_CONFIG.fileName);
              try { sessionStorage.setItem(DOWNLOAD_CONFIG.sessionStorageKey, 'true'); } catch {}
              setState(success ? 'triggered' : 'blocked');
            }
          }
        }, interval);
      };

      React.useEffect(() => {
        startSequence();
        return () => { if (timerRef.current) clearInterval(timerRef.current); };
      }, []);

      const handleCopyFilename = async () => {
        const ok = await copyText(DOWNLOAD_CONFIG.fileName);
        if (ok) {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      const handleCopyLink = async () => {
        const ok = await copyText(window.location.origin + DOWNLOAD_CONFIG.filePath);
        if (ok) {
          setCopiedLink(true);
          setTimeout(() => setCopiedLink(false), 2000);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Header */}
          <header className="w-full max-w-4xl mx-auto pt-6 px-4 pb-4 flex items-center justify-between border-b border-slate-200/60 mb-6 sm:mb-8">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-white font-bold text-lg shadow-sm shadow-brand-500/20">
                A
              </div>
              <div>
                <h1 className="text-base sm:text-lg font-bold text-slate-900 tracking-tight leading-none">
                  {DOWNLOAD_CONFIG.siteName}
                </h1>
                <span className="text-xs text-slate-500 font-mono-code">
                  {DOWNLOAD_CONFIG.siteDomain}
                </span>
              </div>
            </div>

            <div className="flex items-center space-x-2 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-200/60 shadow-xs">
              <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span className="hidden sm:inline">Verified Secure Package</span>
              <span className="sm:hidden">Secure</span>
            </div>
          </header>

          {/* Main Card */}
          <main className="flex-1 flex items-center justify-center py-6 px-4">
            <div className="w-full max-w-lg glass-panel rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/60 border border-slate-200/90 text-center relative overflow-hidden">
              <div className="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-brand-400 via-sky-400 to-indigo-400" />
              
              <div className="mb-4">
                <ZipIllustration />
              </div>

              {/* Status Badge */}
              <div className="mb-3 flex justify-center">
                {state === 'checking' && (
                  <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-slate-100 text-slate-700 text-xs sm:text-sm font-medium border border-slate-200">
                    <span>Verifying package integrity...</span>
                  </div>
                )}
                {state === 'counting' && (
                  <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-brand-50 text-brand-700 text-xs sm:text-sm font-semibold border border-brand-200/80 shadow-xs animate-subtle-pulse">
                    <span className="w-2 h-2 rounded-full bg-brand-500 animate-ping"></span>
                    <span>Your download is starting in {countdown}s...</span>
                  </div>
                )}
                {state === 'triggered' && (
                  <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-emerald-50 text-emerald-800 text-xs sm:text-sm font-semibold border border-emerald-200/80 shadow-xs">
                    <span>Download request initiated successfully!</span>
                  </div>
                )}
                {state === 'blocked' && (
                  <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-amber-50 text-amber-800 text-xs sm:text-sm font-medium border border-amber-200">
                    <span>Auto-download was restricted by your browser</span>
                  </div>
                )}
                {state === 'error' && (
                  <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-rose-50 text-rose-700 text-xs sm:text-sm font-medium border border-rose-200">
                    <span>File not found on server</span>
                  </div>
                )}
              </div>

              <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">
                {state === 'triggered'
                  ? 'Download Initiated!'
                  : state === 'error'
                  ? 'Package Unavailable'
                  : state === 'blocked'
                  ? 'Ready for Manual Download'
                  : 'Your download is starting...'}
              </h2>

              <p className="text-xs sm:text-sm text-slate-500 mt-1 max-w-md mx-auto">
                {state === 'triggered'
                  ? `We've requested your browser to save "${DOWNLOAD_CONFIG.fileName}".`
                  : state === 'error'
                  ? 'The configured ZIP file could not be located in public/downloads/'
                  : state === 'blocked'
                  ? 'Automatic download was blocked by browser policy. Click below to begin.'
                  : 'Connecting to server and transferring official package.'}
              </p>

              {/* Progress bar */}
              {state !== 'error' && state !== 'blocked' && (
                <div className="w-full my-5">
                  <div className="flex items-center justify-between text-xs text-slate-500 mb-1.5 font-medium">
                    <span>{state === 'triggered' ? 'Handed off to browser' : 'Preparing automatic download'}</span>
                    <span className="font-mono-code">{Math.min(100, Math.round(progress))}%</span>
                  </div>
                  <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden p-0.5 border border-slate-200/80">
                    <div
                      className={`h-full rounded-full transition-all duration-150 ease-out ${
                        state === 'triggered'
                          ? 'bg-gradient-to-r from-emerald-500 to-teal-400'
                          : 'bg-gradient-to-r from-brand-500 to-sky-400'
                      }`}
                      style={{ width: `${Math.min(100, Math.max(0, progress))}%` }}
                    />
                  </div>
                  <div className="flex items-center justify-between text-[11px] text-slate-400 mt-1">
                    <span>1. Server Handshake</span>
                    <span>2. Checksum Valid</span>
                    <span>3. Browser Transfer</span>
                  </div>
                </div>
              )}

              {/* File details */}
              <div className="w-full bg-slate-50/80 rounded-2xl p-4 border border-slate-200/90 text-left my-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs sm:text-sm">
                  <div className="bg-white p-3 rounded-xl border border-slate-200/70 shadow-2xs flex items-center justify-between">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">File Name</div>
                      <div className="font-mono-code font-bold text-slate-800 text-sm truncate max-w-[180px] sm:max-w-[200px]" title={DOWNLOAD_CONFIG.fileName}>
                        {DOWNLOAD_CONFIG.fileName}
                      </div>
                    </div>
                    <button
                      onClick={handleCopyFilename}
                      className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-800 transition-colors text-xs font-semibold"
                    >
                      {copied ? 'Copied!' : 'Copy'}
                    </button>
                  </div>

                  <div className="bg-white p-3 rounded-xl border border-slate-200/70 shadow-2xs flex items-center justify-between">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">File Size</div>
                      <div className="font-semibold text-slate-800 text-sm">{fileSize}</div>
                    </div>
                  </div>

                  <div className="bg-white p-3 rounded-xl border border-slate-200/70 shadow-2xs sm:col-span-2 flex items-center justify-between">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Format & Compression</div>
                      <div className="text-slate-700 font-medium text-xs sm:text-sm">
                        {DOWNLOAD_CONFIG.fileFormatLabel} • Unmodified Original
                      </div>
                    </div>
                    <span className="px-2 py-0.5 rounded-md bg-brand-50 text-brand-700 text-[11px] font-semibold border border-brand-100">
                      .ZIP
                    </span>
                  </div>
                </div>
              </div>

              {/* Action buttons */}
              {state !== 'error' && (
                <div className="w-full flex flex-col items-center space-y-3 mt-4">
                  <button
                    onClick={handleManualDownload}
                    type="button"
                    className="w-full py-3.5 px-6 rounded-xl font-bold text-white bg-gradient-to-r from-brand-600 via-brand-500 to-sky-600 hover:from-brand-700 hover:to-sky-700 active:scale-[0.99] transition-all shadow-md shadow-brand-500/25 flex items-center justify-center space-x-2 text-base sm:text-lg cursor-pointer"
                  >
                    <span>Download {DOWNLOAD_CONFIG.fileName}</span>
                    <span className="text-xs font-normal opacity-90 ml-1 py-0.5 px-2 bg-white/20 rounded-md">
                      ({fileSize})
                    </span>
                  </button>

                  <p className="text-xs text-slate-500 text-center">
                    {state === 'triggered' ? (
                      <span className="text-emerald-700 font-medium">
                        Download command sent. If your browser didn't save the file automatically, click the button above.
                      </span>
                    ) : (
                      <span>Safe direct download • No login required • Standard browser storage</span>
                    )}
                  </p>

                  <div className="flex flex-wrap items-center justify-center gap-2 pt-1 text-xs">
                    <button
                      onClick={handleCopyLink}
                      type="button"
                      className="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 hover:text-slate-800 transition-colors font-medium shadow-2xs cursor-pointer"
                    >
                      {copiedLink ? 'Link Copied!' : 'Copy Direct File Link'}
                    </button>
                    <button
                      onClick={handleResetTrigger}
                      type="button"
                      className="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 hover:text-slate-800 transition-colors font-medium shadow-2xs cursor-pointer"
                    >
                      Restart Auto-Download
                    </button>
                  </div>
                </div>
              )}

              {/* Troubleshooting Accordion */}
              <div className="w-full mt-6 pt-4 border-t border-slate-200/70 text-left">
                <button
                  onClick={() => setShowHelp(!showHelp)}
                  className="w-full flex items-center justify-between text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors py-1 cursor-pointer"
                  type="button"
                >
                  <span>Download troubleshooting & browser tips</span>
                  <span className="text-slate-400 font-mono text-sm">{showHelp ? '▲' : '▼'}</span>
                </button>

                {showHelp && (
                  <div className="mt-3 text-xs text-slate-600 bg-slate-50/70 p-3.5 rounded-xl border border-slate-200/80 space-y-2 animate-fade-in leading-relaxed">
                    <div className="flex items-start space-x-2">
                      <span className="font-bold text-brand-600">•</span>
                      <p>
                        <strong>Where is my file?</strong> Check your browser's download shelf or your system's <code>Downloads</code> folder.
                      </p>
                    </div>
                    <div className="flex items-start space-x-2">
                      <span className="font-bold text-brand-600">•</span>
                      <p>
                        <strong>Blocked pop-up?</strong> Some mobile browsers or security extensions block automated downloads. Click the <em>Download ZIP</em> button above.
                      </p>
                    </div>
                    <div className="flex items-start space-x-2">
                      <span className="font-bold text-brand-600">•</span>
                      <p>
                        <strong>Status note:</strong> Due to browser sandboxing and privacy standards, websites cannot detect when file saving finishes on local disk.
                      </p>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="w-full max-w-4xl mx-auto py-8 px-4 text-center text-xs text-slate-400 space-y-2 mt-auto">
            <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-1">
              <span>Ready for deployment at <strong className="text-slate-600 font-mono-code">{DOWNLOAD_CONFIG.siteDomain}</strong></span>
              <span>•</span>
              <span>Hosted on Vercel Global Edge</span>
              <span>•</span>
              <span>Safe &amp; Unmodified ZIP</span>
            </div>
            <p className="text-[11px] text-slate-400">
              &copy; {DOWNLOAD_CONFIG.copyrightYear} {DOWNLOAD_CONFIG.copyrightHolder}. All rights reserved.
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
